<div class="login-container">
  <div class="login-card">
    <button type="button" class="theme-toggle" (click)="themeService.toggleTheme()" [attr.aria-pressed]="themeService.isDark()" aria-label="Alternar tema">
      <span *ngIf="themeService.isDark()">☀️</span>
      <span *ngIf="!themeService.isDark()">🌙</span>
    </button>

    <h2>Área do Cliente</h2>
    <form (ngSubmit)="onLogin()">
      <div class="form-group">
        <label for="email">Email:</label>
        <input 
          type="email" 
          id="email" 
          [(ngModel)]="email" 
          name="email" 
          required 
          placeholder="Digite seu email">
      </div>

      <div class="form-group">
        <label for="password">Senha:</label>
        <input 
          type="password" 
          id="password" 
          [(ngModel)]="password" 
          name="password" 
          required 
          placeholder="Digite sua senha">
      </div>

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button type="submit" class="login-button">Entrar</button>

      <div class="links">
        <a routerLink="/customer-register" class="link">Cadastre-se</a>
        <a routerLink="/password-recovery" class="link">Esqueci minha senha</a>
      </div>
    </form>
  </div>
</div>
