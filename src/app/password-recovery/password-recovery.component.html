<div class="login-container">
  <div class="login-card">
    <button type="button" class="theme-toggle" (click)="themeService.toggleTheme()" [attr.aria-pressed]="themeService.isDark()" aria-label="Alternar tema">
      <span *ngIf="themeService.isDark()">☀️</span>
      <span *ngIf="!themeService.isDark()">🌙</span>
    </button>

    <h2>Recuperação de Senha</h2>

    <form (ngSubmit)="onUpdatePassword()">
      <div class="form-group">
        <label for="cpf">CPF:</label>
        <input 
          type="text" 
          id="cpf" 
          [(ngModel)]="cpf" 
          name="cpf" 
          required 
          placeholder="Digite seu CPF"
          (input)="formatDocument($event)">
      </div>

      <div class="form-group">
        <label for="newPassword">Nova Senha:</label>
        <input 
          type="password" 
          id="newPassword" 
          [(ngModel)]="newPassword" 
          name="newPassword" 
          required 
          placeholder="Digite sua nova senha">
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar Nova Senha:</label>
        <input 
          type="password" 
          id="confirmPassword" 
          [(ngModel)]="confirmPassword" 
          name="confirmPassword" 
          required 
          placeholder="Confirme sua nova senha">
      </div>

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>
      
      <div class="success-message" *ngIf="successMessage">
        {{ successMessage }}
      </div>

      <button type="submit" class="login-button">Atualizar Senha</button>
    </form>

    <div class="links">
      <a routerLink="/customer-login" class="link">Voltar para o Login</a>
    </div>
  </div>
</div>
